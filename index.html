<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kavora — Order Online</title><style>body{font-family:Arial;margin:0;background:#f7f2ea;color:#2b211b}header{background:#241a15;color:#fff;text-align:center;padding:28px}main{max-width:900px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.cart{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 14px #0001}.price{font-weight:700;margin:10px 0}button{border:0;border-radius:10px;padding:10px 14px;background:#6b4226;color:#fff}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 10px;border:1px solid #ddd;border-radius:9px}.cart{margin-top:20px}</style></head><body><header><h1>KAVORA</h1><p>GOOD COFFEE, ANYTIME</p></header><main><h2>Menu</h2><div id="menu" class="grid"></div><section class="cart"><h2>Keranjang</h2><div id="cart"></div><label>Nama</label><input id="name"><label>No. HP</label><input id="phone"><label>Tipe Order</label><select id="type"><option>Take Away</option><option>Delivery</option></select><label>Catatan</label><textarea id="note"></textarea><button onclick="order()">Pesan via WhatsApp</button></section></main><script>const WA='6282262877440';const p=[['Kavora Latte',25000],['Kavora Aren',28000],['Americano',22000],['Mocha',30000],['Chocolate',26000],['Matcha Latte',28000],['Croissant',20000],['Cookies',15000]];let c={};const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);function draw(){menu.innerHTML=p.map((x,i)=>`<div class="card"><h3>${x[0]}</h3><div class="price">${rp(x[1])}</div><button onclick="add(${i})">+ Tambah</button></div>`).join('');drawCart()}function add(i){c[i]=(c[i]||0)+1;drawCart()}function sub(i){c[i]--;if(c[i]<=0)delete c[i];drawCart()}function drawCart(){let k=Object.keys(c);if(!k.length){cart.innerHTML='<p>Keranjang masih kosong.</p>';return}let t=0;cart.innerHTML=k.map(i=>{let s=p[i][1]*c[i];t+=s;return `<p>${p[i][0]} × ${c[i]} — ${rp(s)} <button onclick="sub(${i})">−</button></p>`}).join('')+`<h3>Total: ${rp(t)}</h3>`}function order(){let k=Object.keys(c);if(!k.length)return alert('Keranjang masih kosong');if(!name.value.trim())return alert('Isi nama terlebih dahulu');let t=k.reduce((a,i)=>a+p[i][1]*c[i],0);let msg='Halo Kavora, saya ingin order:%0A%0A'+k.map(i=>p[i][0]+' x '+c[i]+' = '+rp(p[i][1]*c[i])).join('%0A')+'%0A%0ATotal: '+rp(t)+'%0ANama: '+encodeURIComponent(name.value)+'%0ANo HP: '+encodeURIComponent(phone.value)+'%0ATipe: '+encodeURIComponent(type.value)+'%0ACatatan: '+encodeURIComponent(note.value);location.href='https://wa.me/'+WA+'?text='+msg}draw();</script></body></html>
