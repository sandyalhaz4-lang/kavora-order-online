<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#201713">
<title>Kavora — Order Online</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f3ee;color:#241b17}
header{background:linear-gradient(135deg,#17110e,#3a261c);color:#fff}
.hero{max-width:1100px;margin:auto;padding:38px 18px 32px}
.logo{font-size:35px;font-weight:800;letter-spacing:5px}.tagline{margin-top:7px;color:#dbc7b4;font-size:13px;letter-spacing:1.5px}
.hero-copy{max-width:600px;margin-top:22px}.hero-copy h1{font-size:31px;line-height:1.15;margin:0 0 10px}.hero-copy p{margin:0;color:#eaded4;line-height:1.6}
.container{max-width:1100px;margin:auto;padding:22px 18px 50px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.cart-link{border:0;border-radius:999px;background:#6b4226;color:#fff;padding:10px 16px;font-weight:700;cursor:pointer}
.toolbar{display:flex;gap:10px;margin-bottom:14px}.search{flex:1;border:1px solid #ddd2c8;background:#fff;border-radius:12px;padding:13px 14px;font-size:15px;outline:none}
.categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;margin-bottom:18px}.cat{white-space:nowrap;border:1px solid #d9cbbf;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.cat.active{background:#6b4226;color:#fff;border-color:#6b4226}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#fff;border:1px solid #eee3db;border-radius:18px;padding:12px;box-shadow:0 4px 14px rgba(40,25,15,.06);display:flex;flex-direction:column;min-height:285px;overflow:hidden}
.photo{height:145px;border-radius:14px;background:linear-gradient(135deg,#ead9c8,#f7efe7);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px}
.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:38px}
.card h3{font-size:16px;margin:0 0 5px}.desc{font-size:12px;color:#8a7a70;min-height:30px}.price{font-weight:800;margin:8px 0 12px}
.add{margin-top:auto;width:100%;border:0;border-radius:10px;padding:10px;background:#6b4226;color:#fff;font-weight:700;cursor:pointer}
.cart-section{margin-top:30px;background:#fff;border-radius:20px;border:1px solid #eee3db;padding:20px;box-shadow:0 4px 18px rgba(40,25,15,.06)}
.cart-empty{color:#8a7a70}.cart-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.cart-info{flex:1}.cart-info strong{display:block}.cart-info small{color:#8a7a70}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:0;border-radius:8px;background:#eee2d7;cursor:pointer;font-size:17px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:16px 0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:700}
input,select,textarea{width:100%;border:1px solid #ddd2c8;border-radius:10px;padding:11px;background:#fff;font:inherit;margin-top:6px}textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}
.checkout{width:100%;border:0;border-radius:12px;background:#1d1714;color:#fff;padding:13px;font-size:16px;font-weight:800;cursor:pointer;margin-top:14px}.note{font-size:12px;color:#8a7a70;margin-top:8px;text-align:center}
footer{text-align:center;color:#8a7a70;font-size:12px;padding:10px 0 30px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){
.hero{padding:28px 15px 25px}.logo{font-size:29px}.hero-copy h1{font-size:25px}
.container{padding:18px 12px 40px}.topbar{align-items:flex-start}.topbar h2{font-size:22px}.cart-link{padding:9px 12px;font-size:13px}
.grid{gap:10px}.card{padding:10px;min-height:270px;border-radius:15px}.photo{height:125px}.card h3{font-size:14px}.desc{font-size:11px}.price{font-size:14px}.add{font-size:13px;padding:9px}
.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="hero">
<div class="logo">KAVORA</div><div class="tagline">GOOD COFFEE, ANYTIME</div>
<div class="hero-copy"><h1>Kopi favoritmu, siap dipesan.</h1><p>Pilih menu Kavora, masukkan detail pesanan, lalu kirim order langsung melalui WhatsApp.</p></div>
</div></header>

<main class="container">
<div class="topbar"><h2>Menu</h2><button class="cart-link" id="goCart" type="button">🛒 Keranjang <span id="cartCount">0</span></button></div>
<div class="toolbar"><input class="search" id="search" placeholder="Cari menu Kavora..."></div>
<div class="categories" id="categories"></div>
<div class="grid" id="menu"></div>

<section class="cart-section" id="cartSection">
<h2>Keranjang</h2><div id="cart" style="margin-top:8px"></div>
<div id="checkoutArea" style="display:none">
<div class="total"><span>Total</span><span id="total">Rp 0</span></div>
<div class="form-grid">
<div><label>Nama</label><input id="customerName" placeholder="Nama customer"></div>
<div><label>No. HP</label><input id="customerPhone" placeholder="08xxxxxxxxxx"></div>
<div><label>Tipe Order</label><select id="orderType"><option>Take Away</option><option>Delivery</option></select></div>
<div class="full"><label>Catatan / Alamat Delivery</label><textarea id="orderNote" placeholder="Contoh: less ice, tanpa gula, alamat delivery, dll."></textarea></div>
</div>
<button class="checkout" id="orderBtn" type="button">Pesan via WhatsApp</button><div class="note">Pesanan akan disimpan dan dikirim ke WhatsApp Kavora.</div>
</div></section>
</main>
<footer>Kavora Bottled Coffee • Good Coffee, Anytime</footer>

<script>
(function(){
"use strict";
const WA_NUMBER="6282262877440";
const SUPABASE_URL="https://gooawhtldgefmiwplxzs.supabase.co";
const SUPABASE_KEY="sb_publishable_sD0QPAk-uDg5cveBKtwePA_dWV5Q8GH";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products=[],cart=JSON.parse(localStorage.getItem("kavora_cart")||"{}"),activeCat="All";
const menu=document.getElementById("menu"),cartEl=document.getElementById("cart"),cartCount=document.getElementById("cartCount"),totalEl=document.getElementById("total"),checkoutArea=document.getElementById("checkoutArea"),search=document.getElementById("search");
function rupiah(n){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function save(){localStorage.setItem("kavora_cart",JSON.stringify(cart));renderCart()}
function add(id){cart[id]=(cart[id]||0)+1;save()}
function minus(id){if(cart[id])cart[id]--;if(!cart[id])delete cart[id];save()}
function renderCategories(){const cats=["All","Coffee","Non Coffee","Snack"];document.getElementById("categories").innerHTML=cats.map(c=>'<button class="cat '+(activeCat===c?'active':'')+'" data-cat="'+c+'" type="button">'+(c==="All"?"Semua":c)+'</button>').join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderCategories();renderMenu()})}
function renderMenu(){
 const q=search.value.trim().toLowerCase();
 const list=products.filter(p=>(activeCat==="All"||p.category===activeCat)&&(!q||p.name.toLowerCase().includes(q)));
 if(!list.length){menu.innerHTML="<p style='color:#8a7a70'>Menu tidak ditemukan.</p>";return}
 menu.innerHTML=list.map(p=>{
   const visual=p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><span class="placeholder" style="display:none">☕</span>':'<span class="placeholder">☕</span>';
   return '<div class="card"><div class="photo">'+visual+'</div><h3>'+esc(p.name)+'</h3><div class="desc">'+esc(p.description||"")+'</div><div class="price">'+rupiah(p.price)+'</div><button class="add" type="button" data-add="'+p.id+'">+ Tambah</button></div>'
 }).join("");
 document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(b.dataset.add))
}
function renderCart(){
 const valid=Object.keys(cart).filter(id=>products.some(p=>p.id===id));valid.forEach(id=>{if(!cart[id])delete cart[id]});
 const count=Object.values(cart).reduce((a,b)=>a+b,0);cartCount.textContent=count;
 if(!valid.length){cartEl.innerHTML='<div class="cart-empty">Keranjang masih kosong. Pilih menu di atas untuk mulai order.</div>';checkoutArea.style.display="none";totalEl.textContent=rupiah(0);return}
 let total=0;
 cartEl.innerHTML=valid.map(id=>{const p=products.find(x=>x.id===id),sub=p.price*cart[id];total+=sub;return '<div class="cart-row"><div class="cart-info"><strong>'+esc(p.name)+'</strong><small>'+rupiah(p.price)+' / item</small></div><div class="qty"><button type="button" data-minus="'+id+'">−</button><b>'+cart[id]+'</b><button type="button" data-plus="'+id+'">+</button></div></div>'}).join("");
 totalEl.textContent=rupiah(total);checkoutArea.style.display="block";
 document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>minus(b.dataset.minus));document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>add(b.dataset.plus))
}
async function loadProducts(){
 menu.innerHTML='<p style="color:#8a7a70">Memuat menu...</p>';
 const {data,error}=await db.from("products").select("id,name,price,category,description,image_url").eq("is_active",true).order("sort_order",{ascending:true});
 if(error){menu.innerHTML='<p style="color:#a33">Menu gagal dimuat. Silakan refresh halaman.</p>';return}
 products=data||[];renderCategories();renderMenu();renderCart()
}
document.getElementById("goCart").onclick=()=>document.getElementById("cartSection").scrollIntoView({behavior:"smooth",block:"start"});
search.oninput=renderMenu;
document.getElementById("orderBtn").onclick=async()=>{
 const keys=Object.keys(cart).filter(id=>cart[id]>0);if(!keys.length)return alert("Keranjang masih kosong.");
 const name=document.getElementById("customerName").value.trim();if(!name){alert("Silakan isi Nama terlebih dahulu.");return}
 const phone=document.getElementById("customerPhone").value.trim(),type=document.getElementById("orderType").value,note=document.getElementById("orderNote").value.trim();
 let total=0;
 const lines=keys.map(id=>{const p=products.find(x=>x.id===id),sub=p.price*cart[id];total+=sub;return p.name+" x "+cart[id]+" = "+rupiah(sub)});
 const plain="Halo Kavora, saya ingin order:\n\n"+lines.join("\n")+"\n\nTotal: "+rupiah(total)+"\nNama: "+name+"\nNo HP: "+phone+"\nTipe: "+type+"\nCatatan: "+note;
 const btn=document.getElementById("orderBtn");btn.disabled=true;btn.textContent="Memproses...";
 const {data:order,error}=await db.from("orders").insert({customer_name:name,customer_phone:phone,order_type:type,notes:note,total,status:"new",whatsapp_message:plain}).select("id").single();
 if(!error&&order){const items=keys.map(id=>{const p=products.find(x=>x.id===id);return{order_id:order.id,product_id:p.id,product_name:p.name,quantity:cart[id],unit_price:p.price,subtotal:p.price*cart[id]}});await db.from("order_items").insert(items)}
 cart={};localStorage.removeItem("kavora_cart");renderCart();btn.disabled=false;btn.textContent="Pesan via WhatsApp";
 window.location.assign("https://api.whatsapp.com/send?phone="+WA_NUMBER+"&text="+encodeURIComponent(plain))
};
loadProducts();
})();
</script>
</body></html>
