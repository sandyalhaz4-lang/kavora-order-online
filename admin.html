<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kavora Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f2ea;color:#2b211b}
header{background:#241a15;color:#fff;padding:22px 18px}
.wrap{max-width:1100px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1,h2{margin:0}.sub{opacity:.8;margin-top:5px}
button{border:0;border-radius:10px;padding:11px 15px;background:#6b4226;color:#fff;cursor:pointer}
.secondary{background:#e4e0dc;color:#332b26}
.panel{background:#fff;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 4px 18px #0000000d}
.hidden{display:none!important}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:17px;border-radius:15px;background:#f7f2ea}
.stat small{color:#786b63}.stat b{display:block;font-size:24px;margin-top:7px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd3cb;border-radius:10px;margin:5px 0 10px;background:#fff;font:inherit}
.toolbar input{flex:1;min-width:180px;margin:0}
.product{border-top:1px solid #eee;padding:13px 0}
.product:first-child{border-top:0}
.order{border-top:1px solid #eee;padding:15px 0}
.order:first-child{border-top:0}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;margin-left:5px;font-size:12px}
.new{background:#efe0d2}.processing{background:#e4e9ef}.completed{background:#dcebdc}.cancelled{background:#f1dddd}
.muted{color:#766c66}.price{font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.editor{background:#fbf8f4;border-radius:14px;padding:15px;margin-top:12px}
@media(max-width:700px){.grid4{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="wrap">
<div class="top"><div><h1>KAVORA ADMIN</h1><div class="sub">Dashboard • Menu • Pesanan</div></div><button id="logout" class="secondary hidden">Logout</button></div>
</div></header>

<div class="wrap">
<section id="login" class="panel">
<h2>Login Admin</h2><p class="muted">Masukkan email admin. Supabase akan mengirim link login.</p>
<input id="email" type="email" value="sandyalhaz79@gmail.com">
<button id="send">Kirim Link Login</button><p id="loginMsg" class="muted"></p>
</section>

<section id="app" class="hidden">
<div class="grid4">
<div class="stat"><small>Pesanan Hari Ini</small><b id="todayOrders">0</b></div>
<div class="stat"><small>Omzet Hari Ini</small><b id="todaySales">Rp 0</b></div>
<div class="stat"><small>Pesanan Baru</small><b id="newOrders">0</b></div>
<div class="stat"><small>Menu Aktif</small><b id="activeProducts">0</b></div>
</div>

<div class="panel">
<div class="top"><h2>Menu Produk</h2><button id="newProduct">+ Tambah Produk</button></div>
<div class="toolbar"><input id="productSearch" placeholder="Cari produk..."><select id="productFilter"><option value="all">Semua kategori</option><option>Coffee</option><option>Non Coffee</option><option>Snack</option></select></div>
<div id="products"></div>
<div id="editor" class="editor hidden">
<h3 id="editorTitle">Tambah Produk</h3>
<div class="two"><div><label>Nama</label><input id="pname"></div><div><label>Harga</label><input id="price" type="number" min="0"></div></div>
<div class="two"><div><label>Kategori</label><select id="cat"><option>Coffee</option><option>Non Coffee</option><option>Snack</option></select></div><div><label>Urutan</label><input id="sort" type="number" min="0"></div></div>
<label>Deskripsi</label><textarea id="desc" rows="3"></textarea>
<label>URL Foto (opsional)</label><input id="image">
<label><input id="active" type="checkbox" checked style="width:auto"> Produk aktif</label><br>
<button id="save">Simpan</button> <button id="cancel" class="secondary">Batal</button>
</div>
</div>

<div class="panel">
<div class="top"><h2>Pesanan</h2><button id="refresh" class="secondary">Refresh</button></div>
<div class="toolbar"><input id="orderSearch" placeholder="Cari nama / nomor HP..."><select id="statusFilter"><option value="all">Semua status</option><option value="new">New</option><option value="processing">Processing</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>
<div id="orders"></div>
</div>
</section>
</div>

<script>
(() => {
const URL="https://gooawhtldgefmiwplxzs.supabase.co";
const KEY="sb_publishable_sD0QPAk-uDg5cveBKtwePA_dWV5Q8GH";
const ADMIN="sandyalhaz79@gmail.com";
const db=supabase.createClient(URL,KEY);
let products=[],orders=[],editing=null;
const $=id=>document.getElementById(id);
const rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function showApp(user){
 if(!user || (user.email||"").toLowerCase()!==ADMIN){db.auth.signOut();alert("Email ini bukan akun admin Kavora.");return}
 $("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");
 refreshAll();
}
async function init(){
 const {data}=await db.auth.getSession();
 if(data.session) showApp(data.session.user);
}
$("send").onclick=async()=>{
 const email=$("email").value.trim();
 if(email.toLowerCase()!==ADMIN){$("loginMsg").textContent="Gunakan email admin yang terdaftar.";return}
 $("send").disabled=true;$("send").textContent="Mengirim...";
 const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});
 $("loginMsg").textContent=error?error.message:"Link login sudah dikirim. Cek Gmail.";
 $("send").disabled=false;$("send").textContent="Kirim Link Login";
};
db.auth.onAuthStateChange((_e,s)=>{if(s)showApp(s.user)});
$("logout").onclick=()=>db.auth.signOut().then(()=>location.reload());

async function refreshAll(){await Promise.all([loadProducts(),loadOrders()]);updateStats()}
async function loadProducts(){
 const {data,error}=await db.from("products").select("*").order("sort_order");
 if(error){$("products").textContent=error.message;return}
 products=data||[];renderProducts();
}
function renderProducts(){
 const q=$("productSearch").value.trim().toLowerCase(), cat=$("productFilter").value;
 const list=products.filter(p=>(cat==="all"||p.category===cat)&&(!q||p.name.toLowerCase().includes(q)));
 $("products").innerHTML=list.map(p=>`<div class="product"><div class="top">
 <div><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ${esc(p.description||"")}</div></div>
 <div class="price">${rp(p.price)}</div></div>
 <div class="top" style="margin-top:8px"><span class="muted">${p.is_active?"🟢 Aktif":"⚪ Nonaktif"}</span>
 <span><button data-edit="${p.id}">Edit</button> <button class="secondary" data-toggle="${p.id}">${p.is_active?"Nonaktifkan":"Aktifkan"}</button></span></div></div>`).join("")||'<p class="muted">Produk tidak ditemukan.</p>';
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));
 document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggleProduct(b.dataset.toggle));
}
$("productSearch").oninput=renderProducts;$("productFilter").onchange=renderProducts;

$("newProduct").onclick=()=>{
 editing=null;$("editorTitle").textContent="Tambah Produk";
 ["pname","price","desc","image"].forEach(id=>$(id).value="");
 $("cat").value="Coffee";$("sort").value="0";$("active").checked=true;$("editor").classList.remove("hidden");
};
$("cancel").onclick=()=>$("editor").classList.add("hidden");
async function editProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 editing=id;$("editorTitle").textContent="Edit Produk";$("pname").value=p.name;$("price").value=p.price;
 $("cat").value=p.category;$("sort").value=p.sort_order;$("desc").value=p.description||"";$("image").value=p.image_url||"";$("active").checked=p.is_active;$("editor").classList.remove("hidden");
}
$("save").onclick=async()=>{
 const obj={name:$("pname").value.trim(),price:Number($("price").value),category:$("cat").value,sort_order:Number($("sort").value||0),description:$("desc").value.trim(),image_url:$("image").value.trim()||null,is_active:$("active").checked};
 if(!obj.name||obj.price<0)return alert("Nama dan harga wajib diisi.");
 const {error}=editing?await db.from("products").update(obj).eq("id",editing):await db.from("products").insert(obj);
 if(error)return alert(error.message);$("editor").classList.add("hidden");await loadProducts();updateStats();
};
async function toggleProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 const {error}=await db.from("products").update({is_active:!p.is_active}).eq("id",id);
 if(error)return alert(error.message);await loadProducts();updateStats();
}

async function loadOrders(){
 const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false}).limit(100);
 if(error){$("orders").textContent=error.message;return}
 orders=data||[];renderOrders();
}
function renderOrders(){
 const q=$("orderSearch").value.trim().toLowerCase(), st=$("statusFilter").value;
 const list=orders.filter(o=>(st==="all"||o.status===st)&&(!q||String(o.customer_name||"").toLowerCase().includes(q)||String(o.customer_phone||"").includes(q)));
 $("orders").innerHTML=list.map(o=>`<div class="order">
 <div class="top"><div><b>${esc(o.customer_name)}</b><span class="badge ${esc(o.status)}">${esc(o.status)}</span></div><b>${rp(o.total)}</b></div>
 <div class="muted" style="margin-top:5px">${esc(o.order_type||"")} · ${esc(o.customer_phone||"")} · ${new Date(o.created_at).toLocaleString("id-ID")}</div>
 ${o.notes?`<div style="margin-top:6px">📝 ${esc(o.notes)}</div>`:""}
 <div style="margin-top:9px"><select data-status="${o.id}" style="max-width:220px">
 <option value="new" ${o.status==="new"?"selected":""}>New</option><option value="processing" ${o.status==="processing"?"selected":""}>Processing</option><option value="completed" ${o.status==="completed"?"selected":""}>Completed</option><option value="cancelled" ${o.status==="cancelled"?"selected":""}>Cancelled</option>
 </select></div></div>`).join("")||'<p class="muted">Tidak ada pesanan.</p>';
 document.querySelectorAll("[data-status]").forEach(s=>s.onchange=async()=>{const {error}=await db.from("orders").update({status:s.value}).eq("id",s.dataset.status);if(error)alert(error.message);else{const o=orders.find(x=>x.id===s.dataset.status);if(o)o.status=s.value;updateStats();renderOrders();}});
}
$("orderSearch").oninput=renderOrders;$("statusFilter").onchange=renderOrders;$("refresh").onclick=refreshAll;

function updateStats(){
 const today=new Date();today.setHours(0,0,0,0);
 const todays=orders.filter(o=>new Date(o.created_at)>=today);
 $("todayOrders").textContent=todays.length;
 $("todaySales").textContent=rp(todays.filter(o=>o.status!=="cancelled").reduce((s,o)=>s+Number(o.total||0),0));
 $("newOrders").textContent=orders.filter(o=>o.status==="new").length;
 $("activeProducts").textContent=products.filter(p=>p.is_active).length;
}
init();
})();
</script>
</body>
</html>
