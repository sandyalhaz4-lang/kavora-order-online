<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kavora Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f2ea;color:#2b211b}
header{background:#241a15;color:#fff;padding:22px 18px}.wrap{max-width:1100px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1,h2,h3{margin:0}.sub{opacity:.8;margin-top:5px}
button{border:0;border-radius:10px;padding:11px 15px;background:#6b4226;color:#fff;cursor:pointer}.secondary{background:#e4e0dc;color:#332b26}
.panel{background:#fff;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 4px 18px #0000000d}.hidden{display:none!important}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:17px;border-radius:15px;background:#f7f2ea}.stat small{color:#786b63}.stat b{display:block;font-size:24px;margin-top:7px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.toolbar input{flex:1;min-width:180px;margin:0}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd3cb;border-radius:10px;margin:5px 0 10px;background:#fff;font:inherit}
.product,.order{border-top:1px solid #eee;padding:15px 0}.product:first-child,.order:first-child{border-top:0}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eee;margin-left:5px;font-size:12px}.new{background:#efe0d2}.processing{background:#e4e9ef}.completed{background:#dcebdc}.cancelled{background:#f1dddd}
.muted{color:#766c66}.price{font-weight:700}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor{background:#fbf8f4;border-radius:14px;padding:15px;margin-top:12px}
.report{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reportbox{padding:16px;border:1px solid #eee;border-radius:14px}.reportbox b{font-size:22px;display:block;margin-top:6px}
.detail{background:#faf8f5;border-radius:12px;padding:12px;margin-top:10px}.item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
@media(max-width:700px){.grid4{grid-template-columns:1fr 1fr}.two,.report{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="wrap"><div class="top"><div><h1>KAVORA ADMIN</h1><div class="sub">Dashboard • Menu • Pesanan • Laporan</div></div><button id="logout" class="secondary hidden">Logout</button></div></div></header>
<div class="wrap">
<section id="login" class="panel"><h2>Login Admin</h2><p class="muted">Masukkan email admin. Supabase akan mengirim link login.</p><input id="email" type="email" value="sandyalhaz79@gmail.com"><button id="send">Kirim Link Login</button><p id="loginMsg" class="muted"></p></section>

<section id="app" class="hidden">
<div class="grid4">
<div class="stat"><small>Pesanan Hari Ini</small><b id="todayOrders">0</b></div><div class="stat"><small>Omzet Hari Ini</small><b id="todaySales">Rp 0</b></div>
<div class="stat"><small>Pesanan Baru</small><b id="newOrders">0</b></div><div class="stat"><small>Menu Aktif</small><b id="activeProducts">0</b></div>
</div>

<div class="panel"><div class="top"><h2>Menu Produk</h2><button id="newProduct">+ Tambah Produk</button></div>
<div class="toolbar"><input id="productSearch" placeholder="Cari produk..."><select id="productFilter"><option value="all">Semua kategori</option><option>Coffee</option><option>Non Coffee</option><option>Snack</option></select></div>
<div id="products"></div>
<div id="editor" class="editor hidden"><h3 id="editorTitle">Tambah Produk</h3>
<div class="two"><div><label>Nama</label><input id="pname"></div><div><label>Harga</label><input id="price" type="number" min="0"></div></div>
<div class="two"><div><label>Kategori</label><select id="cat"><option>Coffee</option><option>Non Coffee</option><option>Snack</option></select></div><div><label>Urutan</label><input id="sort" type="number" min="0"></div></div>
<label>Deskripsi</label><textarea id="desc" rows="3"></textarea><label>URL Foto (opsional)</label><input id="image">
<label><input id="active" type="checkbox" checked style="width:auto"> Produk aktif</label><br>
<button id="save">Simpan</button> <button id="cancel" class="secondary">Batal</button></div></div>

<div class="panel"><div class="top"><h2>Pesanan</h2><button id="refresh" class="secondary">Refresh</button></div>
<div class="toolbar"><input id="orderSearch" placeholder="Cari nama / nomor HP..."><select id="statusFilter"><option value="all">Semua status</option><option value="new">New</option><option value="processing">Processing</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>
<div id="orders"></div></div>

<div class="panel"><h2>Laporan Penjualan</h2>
<div class="toolbar"><select id="reportRange"><option value="today">Hari Ini</option><option value="7">7 Hari Terakhir</option><option value="30">30 Hari Terakhir</option><option value="all">Semua Data</option></select><button id="reportRefresh" class="secondary">Refresh Laporan</button></div>
<div class="report" style="margin-top:12px"><div class="reportbox"><small>Total Transaksi</small><b id="reportOrders">0</b></div><div class="reportbox"><small>Total Omzet</small><b id="reportSales">Rp 0</b></div></div>
<div id="topProducts" style="margin-top:15px"></div></div>
</section></div>

<script>
(()=>{"use strict";
const URL="https://gooawhtldgefmiwplxzs.supabase.co",KEY="sb_publishable_sD0QPAk-uDg5cveBKtwePA_dWV5Q8GH",ADMIN="sandyalhaz79@gmail.com";
const db=supabase.createClient(URL,KEY);let products=[],orders=[],editing=null,details={};
const $=id=>document.getElementById(id),rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function showApp(u){if(!u||(u.email||"").toLowerCase()!==ADMIN){db.auth.signOut();alert("Email ini bukan akun admin Kavora.");return}$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");refreshAll()}
async function init(){const {data}=await db.auth.getSession();if(data.session)showApp(data.session.user)}
$("send").onclick=async()=>{const e=$("email").value.trim();if(e.toLowerCase()!==ADMIN){$("loginMsg").textContent="Gunakan email admin yang terdaftar.";return}$("send").disabled=true;const {error}=await db.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href}});$("loginMsg").textContent=error?error.message:"Link login sudah dikirim. Cek Gmail."; $("send").disabled=false}
$("logout").onclick=()=>db.auth.signOut().then(()=>location.reload());db.auth.onAuthStateChange((_e,s)=>{if(s)showApp(s.user)});

async function refreshAll(){await Promise.all([loadProducts(),loadOrders()]);updateStats();loadReport()}
async function loadProducts(){const {data,error}=await db.from("products").select("*").order("sort_order");if(error){$("products").textContent=error.message;return}products=data||[];renderProducts()}
function renderProducts(){const q=$("productSearch").value.trim().toLowerCase(),c=$("productFilter").value;const a=products.filter(p=>(c==="all"||p.category===c)&&(!q||p.name.toLowerCase().includes(q)));$("products").innerHTML=a.map(p=>`<div class="product"><div class="top"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ${esc(p.description||"")}</div></div><div class="price">${rp(p.price)}</div></div><div class="top" style="margin-top:8px"><span>${p.is_active?"🟢 Aktif":"⚪ Nonaktif"}</span><span><button data-edit="${p.id}">Edit</button> <button class="secondary" data-toggle="${p.id}">${p.is_active?"Nonaktifkan":"Aktifkan"}</button></span></div></div>`).join("")||'<p class="muted">Produk tidak ditemukan.</p>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggleProduct(b.dataset.toggle))}
$("productSearch").oninput=renderProducts;$("productFilter").onchange=renderProducts;
$("newProduct").onclick=()=>{editing=null;$("editorTitle").textContent="Tambah Produk";$("pname").value="";$("price").value="";$("cat").value="Coffee";$("sort").value="0";$("desc").value="";$("image").value="";$("active").checked=true;$("editor").classList.remove("hidden")};
$("cancel").onclick=()=>$("editor").classList.add("hidden");
async function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editing=id;$("editorTitle").textContent="Edit Produk";$("pname").value=p.name;$("price").value=p.price;$("cat").value=p.category;$("sort").value=p.sort_order;$("desc").value=p.description||"";$("image").value=p.image_url||"";$("active").checked=p.is_active;$("editor").classList.remove("hidden")}
$("save").onclick=async()=>{const o={name:$("pname").value.trim(),price:Number($("price").value),category:$("cat").value,sort_order:Number($("sort").value||0),description:$("desc").value.trim(),image_url:$("image").value.trim()||null,is_active:$("active").checked};if(!o.name||o.price<0)return alert("Nama dan harga wajib diisi.");const r=editing?await db.from("products").update(o).eq("id",editing):await db.from("products").insert(o);if(r.error)return alert(r.error.message);$("editor").classList.add("hidden");await loadProducts();updateStats()};
async function toggleProduct(id){const p=products.find(x=>x.id===id);const {error}=await db.from("products").update({is_active:!p.is_active}).eq("id",id);if(error)alert(error.message);else{await loadProducts();updateStats()}}

async function loadOrders(){const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false}).limit(200);if(error){$("orders").textContent=error.message;return}orders=data||[];renderOrders()}
function renderOrders(){const q=$("orderSearch").value.trim().toLowerCase(),st=$("statusFilter").value;const a=orders.filter(o=>(st==="all"||o.status===st)&&(!q||String(o.customer_name||"").toLowerCase().includes(q)||String(o.customer_phone||"").includes(q)));$("orders").innerHTML=a.map(o=>`<div class="order"><div class="top"><div><b>${esc(o.customer_name)}</b><span class="badge ${esc(o.status)}">${esc(o.status)}</span></div><b>${rp(o.total)}</b></div><div class="muted" style="margin-top:5px">${esc(o.order_type||"")} · ${esc(o.customer_phone||"")} · ${new Date(o.created_at).toLocaleString("id-ID")}</div>${o.notes?`<div style="margin-top:6px">📝 ${esc(o.notes)}</div>`:""}<div style="margin-top:9px"><button class="secondary" data-detail="${o.id}">Lihat Detail</button> <a href="https://wa.me/${String(o.customer_phone||"").replace(/^0/,"62").replace(/\\D/g,"")}" target="_blank"><button type="button">WhatsApp</button></a> <select data-status="${o.id}" style="max-width:180px"><option value="new" ${o.status==="new"?"selected":""}>New</option><option value="processing" ${o.status==="processing"?"selected":""}>Processing</option><option value="completed" ${o.status==="completed"?"selected":""}>Completed</option><option value="cancelled" ${o.status==="cancelled"?"selected":""}>Cancelled</option></select></div><div id="detail-${o.id}" class="detail hidden"></div></div>`).join("")||'<p class="muted">Tidak ada pesanan.</p>';document.querySelectorAll("[data-status]").forEach(s=>s.onchange=async()=>{const r=await db.from("orders").update({status:s.value}).eq("id",s.dataset.status);if(r.error)alert(r.error.message);else{const o=orders.find(x=>x.id===s.dataset.status);if(o)o.status=s.value;updateStats();loadReport();renderOrders()}});document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>showDetail(b.dataset.detail))}
async function showDetail(id){const box=$("detail-"+id);if(!box)return;if(!box.classList.contains("hidden")){box.classList.add("hidden");return}box.classList.remove("hidden");box.innerHTML="Memuat detail...";const {data,error}=await db.from("order_items").select("*").eq("order_id",id);if(error){box.textContent=error.message;return}box.innerHTML=(data||[]).map(i=>`<div class="item"><span>${esc(i.product_name)} × ${i.quantity}</span><b>${rp(i.subtotal)}</b></div>`).join("")||"Tidak ada detail item.";details[id]=data||[]}
$("orderSearch").oninput=renderOrders;$("statusFilter").onchange=renderOrders;$("refresh").onclick=refreshAll;

function updateStats(){const d=new Date();d.setHours(0,0,0,0);const a=orders.filter(o=>new Date(o.created_at)>=d);$("todayOrders").textContent=a.length;$("todaySales").textContent=rp(a.filter(o=>o.status!=="cancelled").reduce((s,o)=>s+Number(o.total||0),0));$("newOrders").textContent=orders.filter(o=>o.status==="new").length;$("activeProducts").textContent=products.filter(p=>p.is_active).length}
$("reportRange").onchange=loadReport;$("reportRefresh").onclick=loadReport;
async function loadReport(){let from=null;const range=$("reportRange").value;if(range==="today"){from=new Date();from.setHours(0,0,0,0)}else if(range!=="all"){from=new Date(Date.now()-Number(range)*86400000);from.setHours(0,0,0,0)}const list=orders.filter(o=>(!from||new Date(o.created_at)>=from)&&o.status!=="cancelled");$("reportOrders").textContent=list.length;$("reportSales").textContent=rp(list.reduce((s,o)=>s+Number(o.total||0),0));
const ids=list.map(o=>o.id);if(!ids.length){$("topProducts").innerHTML='<p class="muted">Belum ada penjualan pada periode ini.</p>';return}
const {data}=await db.from("order_items").select("product_name,quantity,subtotal,order_id").in("order_id",ids);const map={};(data||[]).forEach(i=>{map[i.product_name]??={qty:0,sales:0};map[i.product_name].qty+=Number(i.quantity||0);map[i.product_name].sales+=Number(i.subtotal||0)});const top=Object.entries(map).sort((a,b)=>b[1].qty-a[1].qty).slice(0,5);$("topProducts").innerHTML="<h3>Produk Terlaris</h3>"+(top.length?top.map(([n,v],i)=>`<div class="item"><span>${i+1}. ${esc(n)} × ${v.qty}</span><b>${rp(v.sales)}</b></div>`).join(""):'<p class="muted">Belum ada data.</p>')}
init();
})();
</script>
</body></html>
